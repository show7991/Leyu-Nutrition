<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Leyu Nutrition</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Leyu Nutrition</a> |
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="service.html">Services</a> |
            <a href="contact.html">Contact</a> |
        </nav>
        </header>
    <main>
        <h1>Contact Us</h1>
        <section>
            <h2>Book a Consultation</h2>
            <form action="#"  method="post">
                <p>
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="Full Name" required>
                </p>
                
                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="Email" required> 
                </p>
                
                <p>
                    <label for="plan">Meal Plan:</label>
                    <select id="plan" name="Plan" required>
                        <option value="">-- Choose a plan --</option>
                        <option value="basic">Basic - 1 month</option>
                        <option value="advanced">Advanced - 3 month</option>
                        <option value="premium">Premium - 6 month</option>
                    </select>
                </p>

                <p>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" cols="40"></textarea>
                </p>
                <p><button type="submit">Send</button></p>
            </form>
           
        </section>
    </main>

    <hr>
    <footer>
        <p>Copyright &copy; 2026 Leyu Nutrition.</p>
        <p>Contact Us: <a href="mailto:info@leyunutrition.com"> send us an email</a></p>
    </footer>
</body>
</html>
